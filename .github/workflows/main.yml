name: Build CB Attendance System

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install opencv-python face_recognition pandas openpyxl python-docx pyinstaller

    - name: Build Executable with PyInstaller
      run: |
        python -m PyInstaller --noconsole --onefile cb_attendance_suite.py

    - name: Upload Compiled EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CB-Face-Fingerprint-Attendance-System
        path: dist/cb_attendance_suite.exe
        
